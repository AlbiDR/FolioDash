name: Verify

# The shared quality gate. check.yml runs it for changes and release-site.yml runs it before publishing main.
# The site is built once, in the build job. The audits and the Pages site both read that same artifact, so what the
# audits test is exactly what is published. The gate itself still runs `npm run verify` on the source, as before.

on:
  workflow_call:
    inputs:
      release:
        description: Whether this run prepares a release. A release needs the public client ID and uploads the verified Pages artifact.
        required: true
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  workflows:
    name: Check GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate workflow definitions
        run: npm run verify:workflows

  build:
    name: Build the site
    outputs:
      audit-suites: ${{ steps.suites.outputs.matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the public client ID for a release
        if: inputs.release
        run: |
          if [[ -z "$VITE_GOOGLE_CLIENT_ID" ]]; then
            echo "::error::Set the public repository variable VITE_GOOGLE_CLIENT_ID before releasing."
            exit 1
          fi

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: List rendered audit suites
        id: suites
        run: |
          matrix=$(node scripts/audit/rendered.ts --matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Build the production site
        run: npm run build

      - name: Keep the built site for the audits and the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: dist/web
          retention-days: 1
          if-no-files-found: error

  verify:
    name: Verify project
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Contributor attribution reads the complete history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: Verify the source
        run: npm run verify

      - name: Audit dependencies
        run: npm run audit:dependencies

  audit:
    name: Audit rendered site (${{ matrix.suite }})
    needs: build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.audit-suites) }}
    # macOS, not Linux: the rendered audits assert text geometry, and the app's font stack starts with SF Pro, which only
    # macOS has. The Linux failures are inferred to come from that fallback face; this is not reproduced yet.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: Take the built site from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: dist/web

      - name: Check Chrome and macOS versions
        run: |
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [[ ! -x "$chrome" ]]; then
            echo "::error::Google Chrome is required for the rendered audits."
            exit 1
          fi
          "$chrome" --version
          sw_vers

      # Only the suite that runs the browser component tests needs Playwright's WebKit and Firefox (FD-030).
      - name: Install WebKit and Firefox for the component tests
        if: matrix.suite == 'accessibility-and-polish'
        timeout-minutes: 5
        run: npm run test:browser:install

      - name: Audit the built site in Chrome
        timeout-minutes: 10
        env:
          AUDIT_SUITE: ${{ matrix.suite }}
          # The remembered-session fixture must match the public client ID baked into the build.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run audit:rendered -- "$AUDIT_SUITE"

  # The cross-engine audit is Playwright's own WebKit, Firefox and Chrome, so it runs on Linux, which is not limited by
  # the five concurrent macOS jobs. One job per engine profile; each runs it with motion on and with Reduce Motion on.
  # Trial (2026-11-28): non-blocking until it has passed on Linux repeatedly; then remove continue-on-error.
  cross-engine:
    name: Audit engines (${{ matrix.profile }})
    needs: build
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        profile: ["Safari engine, desktop", "Safari engine, iPhone", "Firefox", "Chrome, Pixel"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: Take the built site from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: dist/web

      - name: Install WebKit and Firefox with their system libraries
        timeout-minutes: 5
        run: npx playwright install --with-deps webkit firefox

      - name: Audit the built site in this engine
        env:
          PROFILE: ${{ matrix.profile }}
        run: npm run audit:cross-engine -- "$PROFILE"

  # A pull request fails when its README screenshots fail. A release does not: the screenshots are documentation, and the
  # checked app must still be published. The site job then reuses the screenshots the live site already serves.
  screenshots:
    name: Validate README screenshots
    if: inputs.release || github.event_name == 'pull_request'
    needs: build
    continue-on-error: ${{ inputs.release }}
    outputs:
      captured: ${{ steps.captured.outputs.captured }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: Take the built site from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: dist/web

      - name: Capture current README views
        timeout-minutes: 3
        run: npm run capture:readme

      - name: Check the screenshots with the release assembly
        run: npm run build:pages

      - name: Keep the checked screenshots for the release
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-screenshots
          path: dist/readme
          retention-days: 1
          if-no-files-found: error

      - name: Report the screenshots as captured
        id: captured
        run: echo 'captured=true' >> "$GITHUB_OUTPUT"

  site:
    name: Assemble the Pages site
    if: ${{ !cancelled() && inputs.release && needs.build.result == 'success' }}
    needs: [build, screenshots]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: Take the built site from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: dist/web

      - name: Take this revision's checked screenshots
        if: needs.screenshots.outputs.captured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readme-screenshots
          path: dist/readme

      - name: Assemble the checked app and this revision's README images
        if: needs.screenshots.outputs.captured == 'true'
        run: npm run build:pages

      - name: Assemble the checked app and the live site's README images
        if: needs.screenshots.outputs.captured != 'true'
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "::warning::README screenshots could not be captured for this revision, so the site keeps the screenshots of the previous release."
          npm run build:pages -- --carry-over "$site"
          printf 'README screenshots could not be captured for `%s`. The checked app is published with the screenshots of the previous release; see the Validate README screenshots job.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages
          retention-days: 1
