name: Verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: Check GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: workflows-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate workflow definitions
        run: npm run verify:workflows

  verify:
    name: Verify (Node ${{ matrix.node }})
    needs: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Supersede checks for this event/ref without cancelling an active deployment.
    concurrency:
      group: verify-${{ github.event_name }}-${{ github.ref }}-${{ matrix.node }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check public release configuration
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [[ -z "$VITE_GOOGLE_CLIENT_ID" ]]; then
            echo "::error::Set the public repository variable VITE_GOOGLE_CLIENT_ID before releasing."
            exit 1
          fi

      - name: Verify project
        run: npm run verify
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Capture current README views
        if: matrix.node == 22 && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 3
        run: |
          if ! CHROME_PATH=$(command -v google-chrome); then
            echo "::error::Google Chrome is required to capture the signed-out README demo."
            exit 1
          fi
          export CHROME_PATH
          npm run capture:readme

      - name: Assemble the checked app and README images
        if: matrix.node == 22 && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run prepare:pages

      - name: Upload the verified site
        if: matrix.node == 22 && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages
          retention-days: 1

  deploy:
    name: Publish verified site
    needs: [workflows, verify]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
