name: Verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 5 * * 3"
  workflow_dispatch:
  # Lets the site deployment run exactly the same checks before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a deploy never cancels the push check.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check punctuation (no em or en dashes)
        run: npm run verify:punctuation

      - name: Verify project
        run: npm run verify

      - name: Audit dependencies
        run: npm run audit:dependencies
