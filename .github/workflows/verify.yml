name: Verify

# The single quality gate and the only path to a release. A release is a push or a manual run on main, and it
# publishes the artifact built in this same run.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 5 * * 3"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Decide whether this run releases
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == "refs/heads/main" && ( "$EVENT" == "push" || "$EVENT" == "workflow_dispatch" ) ]]; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release=false' >> "$GITHUB_OUTPUT"
          fi

  workflows:
    name: Check GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Supersede checks for this event and ref; a release run is never cancelled by a later event.
    concurrency:
      group: workflows-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate workflow definitions
        run: npm run verify:workflows

  verify:
    name: Verify
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: Require the public client ID for a release
        if: needs.plan.outputs.release == 'true'
        run: |
          if [[ -z "$VITE_GOOGLE_CLIENT_ID" ]]; then
            echo "::error::Set the public repository variable VITE_GOOGLE_CLIENT_ID before releasing."
            exit 1
          fi

      - name: Verify project
        run: npm run verify

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Audit rendered interactions
        timeout-minutes: 6
        run: npm run audit:rendered

      - name: Capture current README views
        if: needs.plan.outputs.release == 'true'
        timeout-minutes: 3
        run: npm run capture:readme

      - name: Assemble the checked app and README images
        if: needs.plan.outputs.release == 'true'
        run: npm run build:pages

      - name: Upload the verified site
        if: needs.plan.outputs.release == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages
          retention-days: 1

  deploy:
    name: Publish verified site
    needs: [plan, workflows, verify]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-verified-site.yml
