name: Verify

# The shared quality gate. check.yml runs it for changes and release-site.yml runs it before publishing main.
# The site is built once, in the build job. The audits and the Pages site both read that same artifact, so what the
# audits test is exactly what is published. The gate itself still runs `npm run verify` on the source, as before.

on:
  workflow_call:
    inputs:
      release:
        description: Whether this run prepares a release. A release needs the public client ID and assembles the Pages site.
        required: true
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  workflows:
    name: Check GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate workflow definitions
        run: npm run verify:workflows

  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the public client ID for a release
        if: inputs.release
        run: |
          if [[ -z "$VITE_GOOGLE_CLIENT_ID" ]]; then
            echo "::error::Set the public repository variable VITE_GOOGLE_CLIENT_ID before releasing."
            exit 1
          fi

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: Build the production site
        run: npm run build

      - name: Keep the built site for the audits and the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: dist/web
          retention-days: 1
          if-no-files-found: error

  verify:
    name: Verify project
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Contributor attribution reads the complete history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: Verify the source
        run: npm run verify

      - name: Audit dependencies
        run: npm run audit:dependencies

  audit:
    name: Audit rendered interactions
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: Take the built site from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: dist/web

      - name: Audit the built site in Chrome
        timeout-minutes: 6
        run: npm run audit:rendered

  site:
    name: Assemble the Pages site
    if: inputs.release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: Take the built site from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: dist/web

      - name: Capture current README views
        timeout-minutes: 3
        run: npm run capture:readme

      - name: Assemble the checked app and README images
        run: npm run build:pages

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages
          retention-days: 1
