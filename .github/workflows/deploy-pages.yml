name: Deploy site

# A manual release runs the canonical checks and publishes their same-run artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish current main
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/verify.yml
