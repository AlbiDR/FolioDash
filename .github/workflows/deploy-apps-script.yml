name: Deploy Apps Script

# Pushes the built service to the owner's Apps Script project and moves the API
# executable deployment to the new version. Manual only: it never runs for a pull
# request and never uses code from one. The values come from the GitHub
# environment `apps-script-deploy`, the single place they are changed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apps-script-deploy
    env:
      CLASP_VERSION: 3.4.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify project
        run: npm run verify

      - name: Audit dependencies
        run: npm run audit:dependencies

      # npm run verify already builds and checks dist/apps-script.
      # Install the deployment tool before the Google credential exists on disk.
      - name: Install clasp
        run: >-
          npm install --prefix "$RUNNER_TEMP/foliodash-clasp"
          --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          "@google/clasp@${CLASP_VERSION}"

      - name: Reject a stale revision before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            printf '%s\n' '::error::This revision is no longer the current main revision. Dispatch a new deployment from main.'
            exit 1
          fi

      - name: Validate deployment configuration and write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.APPS_SCRIPT_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLASPRC_JSON" || -z "$SCRIPT_ID" || -z "$DEPLOYMENT_ID" ]]; then
            printf '%s\n' '::error::Configure CLASPRC_JSON, APPS_SCRIPT_SCRIPT_ID and APPS_SCRIPT_DEPLOYMENT_ID before deploying.'
            exit 1
          fi
          node --input-type=module <<'NODE'
          try {
            const credential = JSON.parse(process.env.CLASPRC_JSON);
            if (credential === null || typeof credential !== "object" || Array.isArray(credential)) throw new Error();
          } catch {
            console.error("::error::CLASPRC_JSON must contain a valid clasp credential object.");
            process.exit(1);
          }
          NODE
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("dist/apps-script/.clasp.json", JSON.stringify({ scriptId: process.env.SCRIPT_ID, rootDir: "." }));'

      - name: Push the bundle
        working-directory: dist/apps-script
        run: '"$RUNNER_TEMP/foliodash-clasp/node_modules/.bin/clasp" push --force'

      - name: Move the API executable deployment to the new version
        working-directory: dist/apps-script
        env:
          DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/foliodash-clasp/node_modules/.bin/clasp" redeploy "$DEPLOYMENT_ID" -d "FolioDash ${GITHUB_SHA::7}"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" dist/apps-script/.clasp.json
