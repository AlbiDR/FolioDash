name: Release site

# Publishes main to GitHub Pages. A push to main and a manual run on main both pass the full gate, and then publish the
# site that the gate audited. Any other branch never publishes, and a pull request never reaches this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time. A queued release is never cancelled, because cancelling a deployment can leave it half done.
concurrency:
  group: release-site
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
    with:
      release: true

  publish:
    name: Publish verified site
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This job never checks out source, installs packages or rebuilds: it deploys the artifact the gate produced.
      - name: Check this revision is still current
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            printf 'Skipped site publication for superseded revision `%s`. Current main is `%s`.\n' "$GITHUB_SHA" "$current_sha" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to GitHub Pages
        if: steps.revision.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # Serialises deployments of the same Pages site, without cancelling one in progress.
          timeout: 600000

      - name: Record the released revision
        if: steps.deployment.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Published the verified site for `%s`: %s\n' "$GITHUB_SHA" "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"

      # Best effort. GitHub's image proxy keeps each README image for ten minutes at every location, so without this the
      # README can keep showing the previous screenshots after a release. Only this release's own image URLs are purged.
      - name: Refresh GitHub's cached copies of the README images
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          html="$RUNNER_TEMP/readme.html"
          urls="$RUNNER_TEMP/readme-image-urls.txt"
          gh api "repos/$GITHUB_REPOSITORY/readme" -H 'Accept: application/vnd.github.html+json' > "$html"
          python3 - "$html" > "$urls" <<'PY'
          import os, re, sys
          prefix = os.environ["PAGE_URL"].rstrip("/") + "/readme/"
          seen = set()
          for url, encoded in re.findall(r"(https://camo\.githubusercontent\.com/[0-9a-f]+/([0-9a-f]+))", open(sys.argv[1], encoding="utf-8").read()):
              try:
                  target = bytes.fromhex(encoded).decode()
              except ValueError:
                  continue
              if target.startswith(prefix) and url not in seen:
                  seen.add(url)
                  print(url)
          PY
          total=0
          purged=0
          while read -r url; do
            total=$((total + 1))
            if curl -fsS --max-time 20 -X PURGE "$url" > /dev/null; then purged=$((purged + 1)); else echo "::warning::Could not purge one cached README image."; fi
          done < "$urls"
          printf 'Refreshed %s of %s cached README images.\n' "$purged" "$total" >> "$GITHUB_STEP_SUMMARY"
